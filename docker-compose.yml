

services:
  
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lakehouse-minio
    network_mode: host
    command: server /data --console-address ":9001"
    user: "0:0"            
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

 
  postgres:
    image: postgres:16
    container_name: lakehouse-pg
    network_mode: host
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper
      POSTGRES_DB: lakekeeper
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 20

 
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakehouse-lakekeeper-migrate
    network_mode: host
    command: ["migrate"]
    environment: &lk-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: "lab-secret-key-change-me"
      LAKEKEEPER__METRICS_PORT: "9100"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper@localhost:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper@localhost:5432/lakekeeper
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  
  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    network_mode: host
    command: ["serve"]
    environment: *lk-env
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  
  trino:
    image: trinodb/trino:latest
    container_name: trino
    network_mode: host
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./sql:/sql:ro
    depends_on:
      - lakekeeper

  
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    network_mode: host
    depends_on:
      - trino

volumes:
  minio-data:
  pg-data:
